<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Wiki Game</title>
<style>
  :root {
    --bg: #f3f1ea;
    --panel: #ffffff;
    --ink: #1d1f1a;
    --muted: #686c60;
    --line: #d9d6cb;
    --accent: #3f8a2e;
    --accent-ink: #ffffff;
    --accent-soft: #e3f0dc;
    --target: #b8452f;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 8px;        /* buttons, inputs */
    --radius-lg: 12px;    /* cards, tables, dialogs */
    --radius-pill: 999px; /* mode chips */
    color-scheme: light;  /* also decides whether the article uses the wiki's light or dark theme */
  }
  /* Auto is no data-theme attribute, so an explicit theme (light, dark or one added by the host page) gets only its own rule. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #161814; --panel: #1f221d; --ink: #e8e9e3; --muted: #9da196; --line: #33372f;
      --accent: #6cbf55; --accent-ink: #0d1409; --accent-soft: #24331f;
      --target: #ec8a73;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161814; --panel: #1f221d; --ink: #e8e9e3; --muted: #9da196; --line: #33372f;
    --accent: #6cbf55; --accent-ink: #0d1409; --accent-soft: #24331f;
    --target: #ec8a73;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 var(--font);
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
    padding: 7px 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.07); border-color: var(--accent); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
  .mono { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  /* ---------- Setup screen ---------- */
  #setup { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
  .setup-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
  #setup h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.01em; }
  .theme-pick { color: var(--muted); font-size: 13.5px; }
  .theme-pick select { margin-left: 4px; padding: 3px 6px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  #setup .sub { color: var(--muted); margin: 0 0 24px; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .modes label {
    display: flex; gap: 6px; align-items: center; padding: 6px 12px; border: 1px solid var(--line);
    border-radius: var(--radius-pill); background: var(--panel); cursor: pointer;
  }
  .modes label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .modes input { accent-color: var(--accent); margin: 0; }
  .modes .lbl { align-self: center; color: var(--muted); font-size: 13.5px; }
  .mode-help { color: var(--muted); font-size: 13px; margin: -6px 0 18px; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .arrow { align-self: center; font-size: 22px; color: var(--muted); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-height: 230px;
  }
  .card .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .card.start .tag { color: var(--accent); }
  .card.goal .tag { color: var(--target); }
  .card .row { display: flex; gap: 12px; align-items: flex-start; }
  .card img { width: 72px; height: 72px; object-fit: contain; image-rendering: pixelated; flex: none; }
  .card .title { font-size: 19px; font-weight: 650; margin: 0; }
  .card .desc { color: var(--muted); font-size: 13.5px; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .card input[type=text] { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
  .setup-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 13.5px; }
  .status.err { color: var(--target); }
  .history { margin-top: 36px; }
  .history h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .history table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
  .history th, .history td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .history th { color: var(--muted); font-weight: 600; }
  .history tr:last-child td { border-bottom: 0; }
  .history .lost { color: var(--muted); }
  .history-wrap { overflow-x: auto; }

  /* ---------- Game screen ---------- */
  #game { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  .hud {
    display: flex; gap: 16px; align-items: center; padding: 8px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .hud .goal { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .hud .goal img { width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated; }
  .hud .goal .lbl { font-size: 11px; font-weight: 700; color: var(--target); letter-spacing: .06em; text-transform: uppercase; }
  .hud .goal .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { text-align: right; }
  .stat .v { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .hud .btns { display: flex; gap: 8px; }
  .main { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
  .path {
    border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; background: var(--panel); font-size: 13.5px;
  }
  .path h3 { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .path ol { margin: 0; padding-left: 22px; }
  .path li { padding: 2px 0; word-break: break-word; }
  .path li.cur { font-weight: 650; }
  .path li.back { color: var(--muted); font-style: italic; }
  .viewer { position: relative; min-height: 0; background: var(--bg); }
  .viewer iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 75%, transparent);
    color: var(--ink); font-weight: 600;
  }
  .overlay .box { background: var(--panel); border: 1px solid var(--line); padding: 16px 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow); text-align: center; max-width: 360px; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { background: var(--panel); color: var(--ink); border-radius: var(--radius-lg); padding: 22px; max-width: 520px; width: 100%; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 6px; font-size: 22px; }
  .modal .big { display: flex; gap: 24px; margin: 14px 0; }
  .modal .big .stat { text-align: left; }
  .modal .big .v { font-size: 30px; }
  .modal ol { padding-left: 22px; margin: 6px 0 16px; font-size: 14px; }
  .modal .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .modal .peek { display: flex; gap: 14px; align-items: flex-start; }
  .modal .peek img { width: 96px; height: 96px; object-fit: contain; image-rendering: pixelated; flex: none; }
  .modal p { margin: 0 0 12px; }
  .note { color: var(--muted); font-size: 13px; }

  @media (max-width: 720px) {
    .pair { grid-template-columns: 1fr; }
    .arrow { justify-self: center; transform: rotate(90deg); }
    .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .path { border-right: 0; border-bottom: 1px solid var(--line); max-height: 84px; padding: 8px 16px; }
    .path ol { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-left: 18px; }
    .hud { gap: 10px; padding: 8px 16px; }
    .stat .v { font-size: 17px; }
  }
</style>
</head>
<body>
<script id="theme-boot">
// Runs before first paint, after any theme stylesheets the host page added to <head> (see setTheme).
// Applies the saved theme if it still exists, else the one marked data-mwg-default, else Auto.
const THEMES = [...new Set(['auto', 'light', 'dark', ...Array.from(document.querySelectorAll('[data-mwg-theme]'), el => el.dataset.mwgTheme)])];
{
  let saved;
  try { saved = JSON.parse(localStorage.getItem('mwg.theme')); } catch { /* storage unavailable */ }
  const t = THEMES.includes(saved) ? saved : document.querySelector('[data-mwg-theme][data-mwg-default]')?.dataset.mwgTheme || 'auto';
  if (t !== 'auto') document.documentElement.dataset.theme = t;
}
</script>

<!-- ======================= SETUP ======================= -->
<section id="setup">
  <div class="setup-head">
    <h1>Minecraft Wiki Game</h1>
    <label class="theme-pick">Theme <select id="themeSelect"></select></label>
  </div>
  <p class="sub">Get from the start article to the target article using only links inside minecraft.wiki articles. Fewest clicks and fastest time wins.</p>

  <div class="modes" role="radiogroup" aria-label="Article pool">
    <label><input type="radio" name="mode" value="classic" checked> Classic</label>
    <label><input type="radio" name="mode" value="balanced"> Balanced</label>
    <label><input type="radio" name="mode" value="even"> Even</label>
    <label><input type="radio" name="mode" value="chaos"> Chaos</label>
  </div>
  <p class="mode-help" id="modeHelp"></p>
  <div class="modes" role="group" aria-label="Rules" id="rules"></div>

  <div class="pair">
    <div class="card start" id="cardStart">
      <span class="tag">Start</span>
      <div class="row"><img alt="" class="hidden"><div><p class="title">…</p><p class="desc"></p></div></div>
      <div class="actions">
        <button data-reroll="start">🎲 Reroll</button>
        <input type="text" placeholder="or type an article…" data-custom="start" aria-label="Custom start article">
      </div>
    </div>
    <div class="arrow">➜</div>
    <div class="card goal" id="cardGoal">
      <span class="tag">Target</span>
      <div class="row"><img alt="" class="hidden"><div><p class="title">…</p><p class="desc"></p></div></div>
      <div class="actions">
        <button data-reroll="goal">🎲 Reroll</button>
        <input type="text" placeholder="or type an article…" data-custom="goal" aria-label="Custom target article">
      </div>
    </div>
  </div>

  <div class="setup-actions">
    <button class="primary" id="btnPlay" disabled>Start game</button>
    <button id="btnRerollBoth">🎲 Reroll both</button>
    <button id="btnSwap">⇄ Swap</button>
    <button id="btnCopy" title="Copy a link that opens this exact pair">Copy challenge link</button>
    <span class="status" id="setupStatus"></span>
  </div>

  <div class="history hidden" id="history">
    <h2>Recent games</h2>
    <div class="history-wrap"><table><thead><tr><th>Start</th><th>Target</th><th>Rules</th><th>Clicks</th><th>Time</th><th>When</th></tr></thead><tbody></tbody></table></div>
  </div>
</section>

<!-- ======================= GAME ======================= -->
<section id="game" class="hidden">
  <div class="hud">
    <div class="goal">
      <img alt="" id="hudImg" class="hidden">
      <div style="min-width:0">
        <div class="lbl">Target</div>
        <div class="name" id="hudGoal"></div>
      </div>
      <button class="link" id="btnPeek" style="margin-left:6px;font-size:13px">what is it?</button>
    </div>
    <div class="stat"><div class="v mono" id="hudClicks">0</div><div class="k">Clicks</div></div>
    <div class="stat"><div class="v mono" id="hudTime">0:00</div><div class="k">Time</div></div>
    <div class="btns">
      <button id="btnBack" title="Go back to the previous article (counts as a click)">← Back</button>
      <button id="btnGiveUp">Give up</button>
    </div>
  </div>
  <div class="main">
    <aside class="path"><h3>Your path</h3><ol id="pathList"></ol></aside>
    <div class="viewer">
      <iframe id="frame" title="Wiki article" sandbox="allow-scripts"></iframe>
      <div class="overlay hidden" id="overlay"><div class="box" id="overlayBox"></div></div>
    </div>
  </div>
</section>

<div class="modal-bg hidden" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';

const WIKI = 'https://minecraft.wiki';
const API = WIKI + '/api.php';

// Game-content categories the Classic, Balanced and Even modes draw from (see randomPoolTitle).
const POOL_CATEGORIES = [
  'Blocks', 'Items', 'Hostile mobs', 'Passive mobs', 'Neutral mobs', 'Boss mobs',
  'Overworld biomes', 'Nether biomes', 'End biomes', 'Generated structures',
  'Enchantments', 'Effects', 'Food', 'Tools', 'Weapons', 'Armor', 'Redstone', 'Plants', 'Gameplay',
];

// Non-article namespaces on minecraft.wiki (from meta=siteinfo). Links into these are disabled.
const NAMESPACES = [
  'Media', 'Special', 'Talk', 'User', 'User talk', 'Minecraft Wiki', 'Minecraft Wiki talk', 'Project', 'Project talk',
  'File', 'File talk', 'Image', 'Image talk', 'MediaWiki', 'MediaWiki talk', 'Template', 'Template talk',
  'Help', 'Help talk', 'Category', 'Category talk', 'Module', 'Module talk', 'Bucket', 'Bucket talk',
  'Dungeons', 'Dungeons talk', 'Earth', 'Earth talk', 'Story Mode', 'Story Mode talk', 'Legends', 'Legends talk',
  'Forum', 'Forum talk', 'Tutorial', 'Tutorial talk', 'Movie', 'Movie talk', 'Dungeons II', 'Dungeons II talk',
];

// Chaos mode: generator=random returns lots of version/changelog/history pages; skip those.
const CHAOS_REJECT = /\/|\(disambiguation\)$|^(Java|Bedrock|Pocket|Education|Legacy Console|PlayStation \d|Xbox( 360| One)?|Nintendo|Wii U|New Nintendo 3DS|Pi|Minecraft Launcher|Launcher|Realms|China) Edition|^(Launcher|Minecraft Launcher|Bedrock Dedicated Server|Server) \d|^\d+w\d+[a-z]$|\b\d+\.\d+(\.\d+)?\b/i;

const MIN_BACKLINKS = 5;   // a target must have at least this many incoming article links
const WIKI_STYLES = [
  'ext.embedVideo.styles|jquery.makeCollapsible.styles|jquery.tablesorter.styles|mediawiki.page.gallery.styles|skins.vector.styles.legacy',
  'ext.gadget.site-styles|ext.gadget.sound-styles',
  'site.styles',
  // The wiki's dark theme. Apart from a few rules that change nothing visible here, it is scoped to
  // body.wgl-theme-dark, so it is always loaded and switching the article's theme is a body class change.
  'wgl.theme.dark',
].map(m => `${WIKI}/load.php?lang=en&modules=${encodeURIComponent(m)}&only=styles&skin=vector`);

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

// ---------------------------------------------------------------- API helpers
async function api(params) {
  // origin=* is required for anonymous CORS from a file:// page.
  const res = await fetch(`${API}?${new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', ...params })}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error.info || data.error.code);
  return data;
}

// Caches the promise, so concurrent rolls share one fetch; a failed fetch is evicted.
const categoryCache = new Map();
function categoryMembers(cat) {
  if (!categoryCache.has(cat)) categoryCache.set(cat, fetchCategory(cat).catch(e => { categoryCache.delete(cat); throw e; }));
  return categoryCache.get(cat);
}

async function fetchCategory(cat) {
  const titles = [];
  let cont = {};
  do {
    const d = await api({ action: 'query', list: 'categorymembers', cmtitle: 'Category:' + cat, cmtype: 'page', cmnamespace: '0', cmlimit: '500', ...cont });
    for (const m of d.query.categorymembers) titles.push(m.title);
    cont = d.continue || null;
  } while (cont);
  return titles.filter(t => !t.includes('/') && !/\(disambiguation\)$/.test(t));
}

const INFO_PARAMS = { prop: 'pageprops|pageimages', ppprop: 'description|disambiguation', piprop: 'thumbnail', pithumbsize: '160' };
const BACKLINK_PARAMS = { list: 'backlinks', blnamespace: '0', bllimit: String(MIN_BACKLINKS), blfilterredir: 'nonredirects' };

function toInfo(p) {
  if (!p || p.missing || p.invalid || p.ns !== 0) return null;
  return {
    title: p.title,
    desc: p.pageprops?.description || '',
    img: p.thumbnail?.source || '',
    disambig: !!p.pageprops && 'disambiguation' in p.pageprops,
  };
}

// One request returns 50 random articles with their info; one is picked uniformly among those that pass the filters.
async function randomChaosInfo() {
  for (let i = 0; i < 6; i++) {
    const d = await api({ action: 'query', generator: 'random', grnnamespace: '0', grnfilterredir: 'nonredirects', grnlimit: '50', ...INFO_PARAMS });
    const ok = (d.query?.pages || []).map(toInfo).filter(p => p && !p.disambig && !CHAOS_REJECT.test(p.title));
    if (ok.length) return pick(ok);
  }
  throw new Error('Could not find a suitable random article');
}

function pickWeighted(arr, weight) {
  let r = Math.random() * arr.reduce((s, x) => s + weight(x), 0);
  for (const x of arr) if ((r -= weight(x)) < 0) return x;
  return arr[arr.length - 1];
}

// classic: uniform category, then uniform member. balanced: categories weighted by the square root of their size.
// even: every article in the pool equally likely. The last two need every category, fetched once per session.
async function randomPoolTitle(mode) {
  if (mode === 'classic') return pick(await categoryMembers(pick(POOL_CATEGORIES)));
  const lists = await Promise.all(POOL_CATEGORIES.map(categoryMembers));
  if (mode === 'even') return pick([...new Set(lists.flat())]);
  return pick(pickWeighted(lists, l => Math.sqrt(l.length)));
}

async function backlinkCount(title) {
  const d = await api({ action: 'query', bltitle: title, ...BACKLINK_PARAMS });
  return d.query.backlinks.length;
}

// Resolves redirects/normalisation and returns { title, desc, img, disambig } or null if missing.
// With backlinks, also counts incoming links (up to MIN_BACKLINKS) in the same request.
async function pageInfo(title, { backlinks = false } = {}) {
  const d = await api({ action: 'query', titles: title, redirects: '1', ...INFO_PARAMS, ...(backlinks && { bltitle: title, ...BACKLINK_PARAMS }) });
  const info = toInfo(d.query.pages?.[0]);   // pages is absent for interwiki titles such as de:Diamant
  // bltitle is the title as given; if it redirected, count links to the real article instead.
  if (info && backlinks) info.backlinks = info.title === title ? d.query.backlinks.length : await backlinkCount(info.title);
  return info;
}

// ---------------------------------------------------------------- Setup screen
const setup = { start: null, goal: null, busy: 0, rolls: { start: 0, goal: 0 } };   // rolls: per-card token, so superseded rolls are dropped

function mode() { return $('input[name=mode]:checked').value; }

function setImg(img, src) {
  if (src) { img.src = src; img.classList.remove('hidden'); } else { img.removeAttribute('src'); img.classList.add('hidden'); }
}

const MODE_HELP = {
  classic: 'Classic: game content (blocks, items, mobs, biomes, structures, enchantments, effects and more). Each category is equally likely, so small ones like bosses come up often.',
  balanced: 'Balanced: the same game content, with bigger categories picked more often (by the square root of their size). Bosses and rare biomes still show up, just less.',
  even: 'Even: the same game content, with every article equally likely. Mostly blocks and items.',
  chaos: 'Chaos: any article on the wiki (version and history pages filtered out). Expect obscure starting points.',
};
function updateModeHelp() { $('#modeHelp').textContent = MODE_HELP[mode()]; }

// Optional rules, as checkboxes under the modes. The ones in play are stored with each result
// (personal bests only compare games with the same rules) and carried in challenge links.
const RULES = {
  noback: { label: 'No Back', help: 'The Back button is gone: every click is final.' },
};
function rules() { return Object.keys(RULES).filter(k => $(`#rules input[value=${k}]`).checked); }
function setRules(keys) { for (const k in RULES) $(`#rules input[value=${k}]`).checked = keys.includes(k); }
const rulesText = keys => (keys || []).map(k => RULES[k]?.label || k).join(', ');
const sameRules = (a, b) => (a.rules || []).join() === (b.rules || []).join();

function renderCard(which) {
  const card = which === 'start' ? $('#cardStart') : $('#cardGoal');
  const info = setup[which];
  $('.title', card).textContent = info ? info.title : '…';
  $('.desc', card).textContent = info ? (info.desc || 'No description available.') : '';
  setImg($('img', card), info?.img);
  updatePlay();
}

// Enables Start only for two different articles with no lookup in flight.
function updatePlay() {
  const same = setup.start && setup.goal && setup.start.title === setup.goal.title;
  $('#btnPlay').disabled = !(setup.start && setup.goal) || same || setup.busy > 0;
  if (same && setup.busy === 0) setStatus('Start and target are the same article. Pick a different one.', true);
}

function setStatus(msg, isErr) {
  const el = $('#setupStatus');
  el.textContent = msg || '';
  el.classList.toggle('err', !!isErr);
}

async function withBusy(fn) {
  setup.busy++;
  updatePlay();
  try { return await fn(); }
  catch (e) { setStatus('Network error: ' + e.message + '. Check your connection and try again.', true); }
  finally { setup.busy--; updatePlay(); }
}

async function candidate(which) {
  const goal = which === 'goal';
  if (mode() !== 'chaos') return pageInfo(await randomPoolTitle(mode()), { backlinks: goal });
  const info = await randomChaosInfo();
  if (goal) info.backlinks = await backlinkCount(info.title);
  return info;
}

async function rollOne(which) {
  for (let attempt = 0; attempt < 12; attempt++) {
    const info = await candidate(which);
    // Read the other card now, not before the await: both cards may be rolling at once.
    const other = which === 'start' ? setup.goal : setup.start;
    if (!info || info.disambig || (other && info.title === other.title)) continue;
    if (which === 'goal' && info.backlinks < MIN_BACKLINKS) continue;
    return info;
  }
  throw new Error('Gave up finding a good article');
}

async function reroll(which) {
  const targets = which === 'both' ? ['start', 'goal'] : [which];
  const tokens = Object.fromEntries(targets.map(w => [w, ++setup.rolls[w]]));
  const current = w => tokens[w] === setup.rolls[w];
  setStatus('Picking…');
  await withBusy(async () => {
    for (const w of targets) { setup[w] = null; renderCard(w); }
    // allSettled, so one card failing doesn't end the busy state while the other is still rolling.
    const results = await Promise.allSettled(targets.map(async w => {
      const info = await rollOne(w);
      if (current(w)) { setup[w] = info; renderCard(w); }
    }));
    const failed = results.find(r => r.status === 'rejected');
    if (failed) throw failed.reason;
    if (targets.every(current)) setStatus('');
  });
}

async function setCustom(which, raw) {
  const text = raw.trim();
  if (!text) return;
  setStatus('Looking up “' + text + '”…');
  await withBusy(async () => {
    const info = await pageInfo(text);
    if (!info) { setStatus('No article named “' + text + '” on minecraft.wiki.', true); return; }
    setup.rolls[which]++;
    setup[which] = info;
    renderCard(which);
    setStatus(info.disambig ? 'Heads up: “' + info.title + '” is a disambiguation page.' : '');
  });
}

function challengeLink() {
  const base = location.href.split('#')[0];
  const r = rules();
  return `${base}#start=${encodeURIComponent(setup.start.title)}&target=${encodeURIComponent(setup.goal.title)}` +
    (r.length ? '&rules=' + r.join(',') : '');
}

function renderHistory() {
  const rows = store.get('mwg.history', []);
  $('#history').classList.toggle('hidden', rows.length === 0);
  $('#history tbody').innerHTML = rows.slice(0, 15).map(r => `
    <tr class="${r.won ? '' : 'lost'}">
      <td>${esc(r.start)}</td><td>${esc(r.goal)}</td><td>${esc(rulesText(r.rules))}</td>
      <td class="mono">${r.won ? r.clicks : 'gave up'}</td>
      <td class="mono">${fmtTime(r.ms)}</td>
      <td>${esc(new Date(r.at).toLocaleDateString())}</td>
    </tr>`).join('');
}

// ---------------------------------------------------------------- Game
const game = {
  active: false,
  start: null, goal: null,
  rules: [],         // rule keys in play, read from the checkboxes at start
  path: [],          // every article visited, in order (includes back-navigation)
  stack: [],         // navigation stack for the Back button
  elapsed: 0,        // ms of reading time; time spent loading articles is not counted
  runningSince: 0,
  loading: false,
  navToken: 0,
  timer: 0,
};

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}
function now() { return game.elapsed + (game.runningSince ? performance.now() - game.runningSince : 0); }
function pauseClock() { if (game.runningSince) { game.elapsed += performance.now() - game.runningSince; game.runningSince = 0; } }
function resumeClock() { if (!game.runningSince && game.active) game.runningSince = performance.now(); }
function clicks() { return Math.max(0, game.path.length - 1); }

function renderHud() {
  $('#hudClicks').textContent = clicks();
  $('#hudTime').textContent = fmtTime(now());
  $('#btnBack').disabled = game.stack.length < 2 || game.loading || !game.active;
  $('#btnGiveUp').disabled = game.loading || !game.active;
  $('#pathList').innerHTML = game.path.map((p, i) =>
    `<li class="${i === game.path.length - 1 ? 'cur' : ''} ${p.back ? 'back' : ''}">${esc(p.title)}${p.back ? ' (back)' : ''}</li>`).join('');
  const pl = $('.path'); pl.scrollTop = pl.scrollHeight;
}

function showOverlay(html) { $('#overlayBox').innerHTML = html; $('#overlay').classList.remove('hidden'); }
function hideOverlay() { $('#overlay').classList.add('hidden'); }

function startGame() {
  Object.assign(game, { active: true, start: setup.start, goal: setup.goal, rules: rules(), path: [], stack: [], elapsed: 0, runningSince: 0, loading: false });
  $('#btnBack').classList.toggle('hidden', game.rules.includes('noback'));
  $('#hudGoal').textContent = game.goal.title;
  setImg($('#hudImg'), game.goal.img);
  hideOverlay();
  $('#setup').classList.add('hidden');
  $('#game').classList.remove('hidden');
  clearInterval(game.timer);
  game.timer = setInterval(() => { $('#hudTime').textContent = fmtTime(now()); }, 250);
  history.replaceState(null, '', location.pathname + location.search);
  navigate(game.start.title, null);
}

// Parse results by requested and resolved title, so Back and "Retry this pair" don't refetch.
// The API marks parse responses uncacheable, so the browser cache doesn't help here. Cleared on return to setup.
const parseCache = new Map();
const PARSE_CACHE_MAX = 40;
function cacheParse(keys, page) {
  for (const k of keys) { parseCache.delete(k); parseCache.set(k, page); }
  while (parseCache.size > PARSE_CACHE_MAX) parseCache.delete(parseCache.keys().next().value);
}

async function navigate(title, fragment, { back = false } = {}) {
  if (!game.active || game.loading) return;
  const token = ++game.navToken;
  game.loading = true;   // stays set until the frame reports it has rendered (frameReady)
  pauseClock();
  renderHud();
  showOverlay(`<div class="spinner"></div>Loading ${esc(title)}…`);
  let page;
  try {
    page = parseCache.get(title) ||
      (await api({ action: 'parse', page: title, prop: 'text|displaytitle', redirects: '1', disableeditsection: '1', disablelimitreport: '1' })).parse;
  } catch (e) {
    if (token !== game.navToken) return;
    game.loading = false;
    renderHud();
    showOverlay(`Couldn’t load <b>${esc(title)}</b>.<br><span class="note">${esc(e.message)}</span><br><br>
      <button class="primary" id="btnRetry">Retry</button> <button id="btnCancelNav">Cancel</button>`);
    $('#btnRetry').onclick = () => navigate(title, fragment, { back });
    // With no article loaded yet there is nothing to go back to, so return to setup.
    $('#btnCancelNav').onclick = () => { hideOverlay(); if (!game.path.length) { toSetup(); return; } resumeClock(); renderHud(); };
    return;
  }
  if (token !== game.navToken || !game.active) return;
  cacheParse([title, page.title], page);
  if (back) game.stack.pop(); else game.stack.push(page.title);
  game.path.push({ title: page.title, back });
  renderArticle(page, fragment, token);
  setTimeout(() => frameReady(token), 15000);   // a stalled stylesheet must not leave Back and Give up disabled
  // Compare the post-redirect title, so following a redirect onto the target counts as arriving.
  if (page.title === game.goal.title) { game.loading = false; hideOverlay(); finish(true); return; }
  renderHud();
}

// The frame posts 'ready' once its stylesheets have loaded and its links are wired up; only then does the clock resume.
// It is sent from a separate <script>, so an error in the main frame script can't leave the game stuck loading.
function frameReady(token) {
  if (token !== game.navToken || !game.active || !game.loading) return;
  game.loading = false;
  hideOverlay();
  renderHud();
  resumeClock();
}

// ---------------------------------------------------------------- Themes
// Auto (no data-theme attribute) follows the OS. The page serving the game can add themes with
// <link rel="stylesheet" data-mwg-theme="Name"> or <style data-mwg-theme="Name"> in <head>, defining
// :root[data-theme="Name"] { --bg: …; color-scheme: dark; } (any variable left out keeps its light value).
// data-mwg-default on one makes it the default. The names auto, light and dark are the built-in themes'.
// THEMES and the initial theme come from #theme-boot.
const THEME_LABELS = { auto: 'Auto', light: 'Light', dark: 'Dark' };
// The wiki's body classes for its two themes: set in the article's srcdoc, swapped by the frame script.
const WGL_THEME_CLASSES = { dark: ['wgl-darkmode', 'wgl-theme-dark'], light: ['wgl-lightmode', 'wgl-theme-light'] };

function setTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  store.set('mwg.theme', t);
  syncFrameTheme();
}

// The article uses the wiki's light or dark theme, matching the game theme's color-scheme.
function themeIsDark() {
  const cs = getComputedStyle(document.documentElement).colorScheme.split(' ');
  if (cs.includes('dark') !== cs.includes('light')) return cs.includes('dark');
  return matchMedia('(prefers-color-scheme: dark)').matches;   // "normal" or "light dark"
}

// Restyles the loaded article in place. Also sent when a frame reports ready, in case the theme changed while it loaded.
function syncFrameTheme() { $('#frame').contentWindow?.postMessage({ mwg: 'theme', dark: themeIsDark() }, '*'); }

function renderArticle(page, fragment, token) {
  const dark = themeIsDark();
  // The article renders in a sandboxed iframe (opaque origin): the wiki's own CSS applies untouched,
  // <base> resolves its relative image/CSS URLs, and the inline script reports clicks via postMessage.
  const frameScript = `
    const NS = new Set(${JSON.stringify(NAMESPACES.map(n => n.toLowerCase()))});
    const FRAG = ${JSON.stringify(fragment || '')};
    const WGL = ${JSON.stringify(WGL_THEME_CLASSES)};
    function classify(a) {
      const href = a.getAttribute('href') || '';
      if (href.startsWith('#')) { try { return { kind: 'anchor', id: decodeURIComponent(href.slice(1)) }; } catch (e) { return null; } }
      if (!href.startsWith('/w/') || a.classList.contains('new')) return null;
      let rest = href.slice(3);
      if (rest.includes('?')) return null;
      let frag = '';
      const h = rest.indexOf('#');
      if (h >= 0) { frag = rest.slice(h + 1); rest = rest.slice(0, h); }
      let t;
      try { t = decodeURIComponent(rest).replace(/_/g, ' '); frag = decodeURIComponent(frag); } catch (e) { return null; }
      const c = t.indexOf(':');
      if (c > 0 && NS.has(t.slice(0, c).trim().toLowerCase())) return null;
      return { kind: 'article', title: t, frag };
    }
    function scrollToId(id) {
      if (!id) return;
      const el = document.getElementById(id) || document.getElementById(id.replace(/ /g, '_'));
      if (el) el.scrollIntoView({ block: 'start' });
    }
    // <area> covers image maps (ImageMap extension).
    for (const a of document.querySelectorAll('a, area')) {
      const c = classify(a);
      if (!c) a.classList.add('mwg-dead');
      else if (c.kind === 'article') a.classList.add('mwg-live');
      a.removeAttribute('target');
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a, area');
      if (!a) return;
      e.preventDefault();
      const c = classify(a);
      if (!c) return;
      if (c.kind === 'anchor') scrollToId(c.id);
      else parent.postMessage({ mwg: 'nav', title: c.title, frag: c.frag }, '*');
    }, true);
    document.addEventListener('submit', e => e.preventDefault(), true);
    document.addEventListener('keydown', e => parent.postMessage({ mwg: 'key', key: e.key }, '*'));
    addEventListener('message', e => {
      if (e.source !== parent || e.data?.mwg !== 'theme') return;
      for (const c of WGL.dark) document.body.classList.toggle(c, e.data.dark);
      for (const c of WGL.light) document.body.classList.toggle(c, !e.data.dark);
    });
    scrollToId(FRAG);
  `.replace(/<\/script/gi, '<\\/script');

  const html = `<!doctype html>
<html class="client-nojs" lang="en" dir="ltr"><head><meta charset="utf-8">
<base href="${WIKI}/">
${WIKI_STYLES.map(h => `<link rel="stylesheet" href="${esc(h)}">`).join('\n')}
<style>
  html, body { background: #fff !important; }
  html:has(body.wgl-theme-dark), body.wgl-theme-dark { background: #121212 !important; }
  body { margin: 0; }
  #content { margin: 0 !important; border: 0 !important; padding: 20px 28px 60px !important; max-width: 1200px; background: transparent !important; }
  .mw-editsection, iframe, .embedvideo, .mw-ext-embedvideo, audio, video { display: none !important; }
  a.mwg-dead { color: inherit !important; text-decoration: none !important; cursor: not-allowed; opacity: .6; }
  a.mwg-dead img { opacity: 1; }
  a.mwg-live { cursor: pointer; }
</style>
</head><body class="mediawiki ltr sitedir-ltr ns-0 ns-subject skin-vector skin-vector-legacy action-view ${WGL_THEME_CLASSES[dark ? 'dark' : 'light'].join(' ')}">
<div id="content" class="mw-body" role="main">
  <h1 id="firstHeading" class="firstHeading mw-first-heading">${page.displaytitle || esc(page.title)}</h1>
  <div id="bodyContent" class="vector-body"><div id="mw-content-text" class="mw-body-content mw-content-ltr">${page.text}</div></div>
</div>
<script>${frameScript}<\/script>
<script>parent.postMessage({ mwg: 'ready', token: ${token} }, '*');<\/script>
</body></html>`;
  $('#frame').srcdoc = html;
}

window.addEventListener('message', e => {
  if (e.source !== $('#frame').contentWindow || !e.data) return;
  if (e.data.mwg === 'nav') navigate(e.data.title, e.data.frag);
  if (e.data.mwg === 'ready') { syncFrameTheme(); frameReady(e.data.token); }
  if (e.data.mwg === 'key' && e.data.key === 'Escape' && modalDismissable) closeModal();
});

function goBack() {
  if (game.stack.length < 2 || game.loading || game.rules.includes('noback')) return;
  navigate(game.stack[game.stack.length - 2], null, { back: true });
}

function finish(won) {
  pauseClock();
  game.active = false;
  game.navToken++;
  clearInterval(game.timer);
  renderHud();
  const ms = now();
  const rec = { start: game.start.title, goal: game.goal.title, rules: game.rules, won, clicks: clicks(), ms, at: Date.now(), path: game.path.map(p => p.title) };
  const rulesNote = rulesText(rec.rules);
  const hist = store.get('mwg.history', []);
  const best = hist.filter(r => r.won && r.start === rec.start && r.goal === rec.goal && sameRules(r, rec))
    .sort((a, b) => a.clicks - b.clicks || a.ms - b.ms)[0];
  hist.unshift(rec);
  store.set('mwg.history', hist.slice(0, 50));

  const pathHtml = game.path.map(p => `<li>${esc(p.title)}${p.back ? ' <span class="note">(back)</span>' : ''}</li>`).join('');
  let bestNote = '';
  if (won && best) {
    bestNote = (rec.clicks < best.clicks || (rec.clicks === best.clicks && rec.ms < best.ms))
      ? '<p class="note">New personal best for this pair!</p>'
      : `<p class="note">Your best for this pair: ${best.clicks} clicks in ${fmtTime(best.ms)}.</p>`;
  }
  openModal(`
    <h2>${won ? '🎉 You made it!' : 'Game over'}</h2>
    <p class="note">${esc(rec.start)} → ${esc(rec.goal)}${rulesNote ? ' · ' + esc(rulesNote) : ''}</p>
    <div class="big">
      <div class="stat"><div class="v mono">${won ? rec.clicks : '—'}</div><div class="k">Clicks</div></div>
      <div class="stat"><div class="v mono">${fmtTime(ms)}</div><div class="k">Time</div></div>
      <div class="stat"><div class="v mono">${game.path.length}</div><div class="k">Pages seen</div></div>
    </div>
    ${bestNote}
    <strong>Path</strong>
    <ol>${pathHtml}</ol>
    <div class="actions">
      <button id="mCopy">Copy result</button>
      <button id="mSame">Retry this pair</button>
      <button class="primary" id="mNew">New game</button>
    </div>`, false);
  $('#mCopy').onclick = async () => {
    const text = `Minecraft Wiki Game: ${rec.start} → ${rec.goal}${rulesNote ? ` (${rulesNote})` : ''}\n` +
      (won ? `${rec.clicks} clicks in ${fmtTime(ms)}\n` : `Gave up after ${fmtTime(ms)}\n`) +
      rec.path.join(' → ');
    try { await navigator.clipboard.writeText(text); $('#mCopy').textContent = 'Copied!'; }
    catch { $('#mCopy').textContent = 'Copy failed'; }
  };
  $('#mSame').onclick = () => { closeModal(); startGame(); };
  $('#mNew').onclick = () => { closeModal(); toSetup(); reroll('both'); };
}

function toSetup() {
  game.active = false;
  clearInterval(game.timer);
  parseCache.clear();
  $('#frame').srcdoc = '';
  $('#game').classList.add('hidden');
  $('#setup').classList.remove('hidden');
  renderHistory();
}

// ---------------------------------------------------------------- Modal
let modalDismissable = true;
function openModal(html, dismissable = true) {
  modalDismissable = dismissable;
  $('#modal').innerHTML = html;
  $('#modalBg').classList.remove('hidden');
}
function closeModal() {
  if ($('#modalBg').classList.contains('hidden')) return;
  $('#modalBg').classList.add('hidden');
  if (game.active && !game.loading) resumeClock();
}
$('#modalBg').addEventListener('click', e => { if (e.target === $('#modalBg') && modalDismissable) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalDismissable) closeModal(); });

// ---------------------------------------------------------------- Wiring
$('#rules').innerHTML = '<span class="lbl">Rules</span>' + Object.entries(RULES).map(([k, r]) =>
  `<label title="${esc(r.help)}"><input type="checkbox" value="${k}"> ${esc(r.label)}</label>`).join('');
$('#themeSelect').innerHTML = THEMES.map(t => `<option value="${esc(t)}">${esc(THEME_LABELS[t] || t)}</option>`).join('');
$('#themeSelect').value = document.documentElement.dataset.theme || 'auto';
$('#themeSelect').onchange = e => setTheme(e.target.value);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncFrameTheme);
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => { updateModeHelp(); reroll('both'); }));
document.querySelectorAll('[data-reroll]').forEach(b => b.addEventListener('click', () => reroll(b.dataset.reroll)));
document.querySelectorAll('[data-custom]').forEach(inp => {
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { setCustom(inp.dataset.custom, inp.value); inp.value = ''; } });
});
$('#btnRerollBoth').onclick = () => reroll('both');
$('#btnSwap').onclick = () => { [setup.start, setup.goal] = [setup.goal, setup.start]; renderCard('start'); renderCard('goal'); };
$('#btnPlay').onclick = startGame;
$('#btnCopy').onclick = async () => {
  if (!setup.start || !setup.goal) return;
  try { await navigator.clipboard.writeText(challengeLink()); setStatus('Challenge link copied.'); }
  catch { setStatus(challengeLink()); }
};
$('#btnBack').onclick = goBack;
$('#btnGiveUp').onclick = () => {
  if (!game.active) return;
  pauseClock();
  openModal(`<h2>Give up?</h2><p>Your time is paused.</p>
    <div class="actions"><button id="gKeep">Keep going</button><button class="primary" id="gQuit">Give up</button></div>`);
  $('#gKeep').onclick = closeModal;
  $('#gQuit').onclick = () => { $('#modalBg').classList.add('hidden'); finish(false); };
};
$('#btnPeek').onclick = () => {
  const g = game.goal;
  openModal(`<h2>Target: ${esc(g.title)}</h2>
    <div class="peek">${g.img ? `<img src="${esc(g.img)}" alt="">` : ''}<p>${esc(g.desc || 'No description available.')}</p></div>
    <p class="note">The clock keeps running while you peek.</p>
    <div class="actions"><button class="primary" id="pClose">Back to the hunt</button></div>`);
  $('#pClose').onclick = closeModal;
};
// Initial load: a #start=…&target=… hash plays that exact pair, otherwise roll a random one.
(async function init() {
  updateModeHelp();
  renderHistory();
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('rules')) setRules(h.get('rules').split(','));
  if (h.get('start') && h.get('target')) {
    setStatus('Loading challenge…');
    let missing = null;
    await withBusy(async () => {
      const [s, g] = await Promise.all([pageInfo(h.get('start')), pageInfo(h.get('target'))]);
      if (!s || !g) { missing = !s ? h.get('start') : h.get('target'); return; }
      setup.start = s; setup.goal = g;
      renderCard('start'); renderCard('goal');
      const r = rulesText(rules());
      setStatus(`Challenge loaded${r ? ' with ' + r : ''}. Press Start when ready.`);
    });
    if (!setup.start || !setup.goal) {
      await reroll('both');
      if (missing && setup.start && setup.goal) setStatus('The challenge link’s article “' + missing + '” doesn’t exist, so a random pair was rolled instead.', true);
    }
  } else {
    reroll('both');
  }
})();
</script>
</body>
</html>
